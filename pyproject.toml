[project]
name = "solver-in-a-box"
version = "0.1.0"
description = "Reference implementation of a LI.FI Intents solver"
requires-python = ">=3.11"
dependencies = [
    "web3>=6.20.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "eth-account>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solver*", "mock_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
